[package]
name = "intui-types"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_path_to_error = "0.1"

[build-dependencies]
typify = { version = "=0.8.0", default-features = false }
schemars = "=0.8.22"
serde_json = "1"
syn = { version = "2", features = ["full"] }
prettyplease = "0.2"
