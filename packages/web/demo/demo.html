<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IntUI web demo</title>
<link rel="stylesheet" href="intui-web.css">
<style>
  :root {
    --page: oklch(0.975 0.004 75);
    --page-fg: oklch(0.24 0.012 75);
    --page-muted: oklch(0.5 0.012 75);
    --page-line: oklch(0.9 0.006 75);
    --frame: oklch(0.995 0.002 75);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: oklch(0.19 0.005 75);
      --page-fg: oklch(0.93 0.006 75);
      --page-muted: oklch(0.7 0.01 75);
      --page-line: oklch(0.32 0.008 75);
      --frame: oklch(0.22 0.006 75);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --page: oklch(0.19 0.005 75);
    --page-fg: oklch(0.93 0.006 75);
    --page-muted: oklch(0.7 0.01 75);
    --page-line: oklch(0.32 0.008 75);
    --frame: oklch(0.22 0.006 75);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--page-fg);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header, main, footer { max-width: 1840px; margin: 0 auto; padding: 0 16px; }
  header { padding-top: 28px; padding-bottom: 8px; }
  h1 { margin: 0; font-size: 1.5625rem; letter-spacing: -0.015em; line-height: 1.2; }
  header p { margin: 0.3em 0 0; color: var(--page-muted); max-width: 70ch; }
  .demo-kind { padding: 22px 0 26px; border-top: 1px solid var(--page-line); }
  .demo-kind:first-child { border-top: 0; }
  .demo-kind h2 { margin: 0; font-size: 1.25rem; line-height: 1.3; }
  .demo-note { margin: 0.2em 0 14px; color: var(--page-muted); }
  .demo-frames { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
  .demo-frame {
    position: relative;
    width: var(--w);
    max-width: 100%;
    padding: 16px;
    padding-top: 30px;
    background: var(--frame);
    border: 1px solid var(--page-line);
    border-radius: 8px;
    /* The renderer reads the host's background for halos behind arrow labels. */
    --intui-bg: var(--frame);
  }
  .demo-width {
    position: absolute; top: 8px; left: 16px;
    font-size: 12px; color: var(--page-muted); font-variant-numeric: tabular-nums;
  }
  footer { padding-bottom: 40px; }
  footer h2 { font-size: 1.25rem; margin: 0 0 6px; }
  #log { margin: 0; padding-left: 1.2em; font: 12px/1.6 ui-monospace, Menlo, monospace; color: var(--page-muted); overflow-wrap: anywhere; }
  #log:empty::before { content: "Press a button or submit a form; its event shows here."; font-family: system-ui, sans-serif; }
.intui-group--thread { height: 260px; }
</style>
</head>
<body>
<header>
  <h1>IntUI web renderer</h1>
  <p>Every core component's example, at three widths, then a few harder trees. Add <code>?theme=dark</code> or <code>?theme=light</code> to force a theme.</p>
</header>
<main id="kinds"></main>
<footer>
  <h2>Events</h2>
  <ol id="log"></ol>
</footer>
<script src="demo.js"></script>
</body>
</html>
